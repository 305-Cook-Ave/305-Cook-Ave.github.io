
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from Sivasarana</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #172554, #312e81);
            color: white;
            padding: 24px;
            overflow: hidden;
        }

        /* ENVELOPE SCREEN */

        .envelope-screen {
            text-align: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .envelope-screen.hide {
            opacity: 0;
            transform: scale(0.7);
            pointer-events: none;
        }

        .envelope {
            position: relative;
            width: 180px;
            height: 125px;
            margin: 0 auto 35px;
            cursor: pointer;
            animation: float 2.5s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.1);
        }

        .envelope-body {
            position: absolute;
            inset: 0;
            background: #e0e7ff;
            border-radius: 8px;
            overflow: hidden;
            z-index: 2;
        }

        .envelope-body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #c7d2fe, #818cf8);
            clip-path: polygon(0 0, 50% 65%, 100% 0, 100% 100%, 0 100%);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: #a5b4fc;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.7s ease;
            z-index: 3;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
        }

        .letter {
            position: absolute;
            width: 145px;
            height: 100px;
            background: white;
            border-radius: 5px;
            top: 10px;
            left: 17px;
            z-index: 1;
            transition: transform 0.8s ease;
        }

        .envelope.open .letter {
            transform: translateY(-85px);
        }

        .seal {
            position: absolute;
            z-index: 4;
            top: 42px;
            left: 72px;
            width: 36px;
            height: 36px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }

        .envelope.open .seal {
            opacity: 0;
        }

        .envelope-text {
            color: #c7d2fe;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }

        .envelope-subtext {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 10px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* MESSAGE CARD */

        .card {
            display: none;
            width: 100%;
            max-width: 550px;
            padding: 55px 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
        }

        .card.show {
            display: block;
            animation: appear 0.8s ease forwards;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 22px;
            font-size: 35px;
        }

        .label {
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 42px);
            font-weight: 800;
            margin-bottom: 18px;
            letter-spacing: -1.5px;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.25s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .button:hover {
            background: #818cf8;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
        }

        .url {
            margin-top: 22px;
            margin-bottom: 0;
            font-size: 13px;
            color: #94a3b8;
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 12px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ENVELOPE INTRO -->

    <div class="envelope-screen" id="envelopeScreen">

        <div class="envelope" id="envelope" onclick="openEnvelope()">

            <div class="letter"></div>

            <div class="envelope-body"></div>

            <div class="envelope-flap"></div>

            <div class="seal">✉</div>

        </div>

        <div class="envelope-text">
            You've got a message!
        </div>

        <div class="envelope-subtext">
            Click the envelope to open it
        </div>

    </div>


    <!-- MESSAGE -->

    <main class="card" id="messageCard">

        <div class="icon">✉️</div>

        <div class="label">An Important Update</div>

        <h1>Message from Sivasarana</h1>

        <p>
            We've moved! Our website has a new home.
            Please visit our new website using the link below.
        </p>

        <a class="button" href="https://calculatedbreak.github.io">
            Visit Our New Website →
        </a>

        <p class="url">calculatedbreak.github.io</p>

        <footer>
            Thank you for visiting!
        </footer>

    </main>


    <script>
        let opened = false;

        function openEnvelope() {
            if (opened) return;
            opened = true;

            const envelope = document.getElementById("envelope");
            const screen = document.getElementById("envelopeScreen");
            const card = document.getElementById("messageCard");

            // Open the envelope
            envelope.classList.add("open");

            // Wait for the opening animation
            setTimeout(() => {
                screen.classList.add("hide");
            }, 700);

            // Show the message
            setTimeout(() => {
                screen.style.display = "none";
                card.classList.add("show");
            }, 1250);
        }
    </script>

</body>
</html>
