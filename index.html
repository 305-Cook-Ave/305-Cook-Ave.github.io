
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from Sivasarana</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #172554, #312e81);
            color: white;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 550px;
            padding: 55px 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            animation: appear 0.8s ease;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 22px;
            font-size: 35px;
        }

        .label {
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 42px);
            font-weight: 800;
            margin-bottom: 18px;
            letter-spacing: -1.5px;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.25s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .button:hover {
            background: #818cf8;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
        }

        .url {
            margin-top: 22px;
            margin-bottom: 0;
            font-size: 13px;
            color: #94a3b8;
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 12px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="icon">✉️</div>

        <div class="label">An Important Update</div>

        <h1>Message from Sivasarana</h1>

        <p>
            We've moved! Our website has a new home.
            Please visit our new website using the link below.
            305 Cook Ave is Vyom Bhosle's address btw not mine
        </p>

        <a class="button" href="https://calculatedbreak.github.io">
            Visit Our New Website →
        </a>

        <p class="url">calculatedbreak.github.io</p>

        <footer>
            Thank you for visiting!
        </footer>
    </main>

</body>
</html>
