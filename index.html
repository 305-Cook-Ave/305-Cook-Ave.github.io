<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from Sivasarana</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #172554, #312e81);
            color: white;
            padding: 24px;
            overflow: hidden;
        }

        /* =========================
           ENVELOPE INTRO
        ========================= */

        .envelope-screen {
            text-align: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .envelope-screen.hide {
            opacity: 0;
            transform: scale(0.7);
            pointer-events: none;
        }

        .envelope {
            position: relative;
            width: 180px;
            height: 125px;
            margin: 90px auto 35px; /* top space so the letter has room to slide up */
            cursor: pointer;
            animation: float 2.5s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
            perspective: 800px;
        }

        .envelope:hover {
            animation-play-state: paused;
        }

        .envelope:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 8px;
            border-radius: 8px;
        }

        /* BACK OF ENVELOPE (z-index 1) */

        .envelope-back {
            position: absolute;
            inset: 0;
            background: #818cf8;
            border-radius: 8px;
            z-index: 1;
        }

        /* LETTER: sits between back and front (z-index 2, never changes) */

        .letter {
            position: absolute;
            width: 145px;
            height: 100px;
            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0 14px,
                    #e2e8f0 14px 16px
                ),
                #ffffff;
            border-radius: 5px;
            top: 10px;
            left: 17px;
            z-index: 2;
            transition: transform 0.8s ease 0.3s;
        }

        /* FRONT POCKET: covers the bottom of the letter (z-index 3) */

        .envelope-front {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            border-radius: 8px;
            clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
            z-index: 3;
        }

        /* FLAP (z-index 4 closed; swaps behind the letter midway through the flip) */

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 52%;
            background: #c7d2fe;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transform: rotateX(0deg);
            transition: transform 0.7s ease, z-index 0s linear 0.35s;
            z-index: 4;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* LETTER SLIDES OUT (after the flap has opened) */

        .envelope.open .letter {
            transform: translateY(-85px);
        }

        /* SEAL (z-index 5, on top of everything) */

        .seal {
            position: absolute;
            z-index: 5;
            top: 47px;
            left: 72px;
            width: 36px;
            height: 36px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }

        .envelope.open .seal {
            opacity: 0;
            pointer-events: none;
        }

        /* TEXT UNDER ENVELOPE */

        .envelope-text {
            color: #c7d2fe;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }

        .envelope-subtext {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 10px;
        }

        /* =========================
           MESSAGE CARD
        ========================= */

        .card {
            display: none;
            width: 100%;
            max-width: 550px;
            padding: 55px 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
        }

        .card.show {
            display: block;
            animation: appear 0.8s ease forwards;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 22px;
            font-size: 35px;
        }

        .label {
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 42px);
            font-weight: 800;
            margin-bottom: 18px;
            letter-spacing: -1.5px;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.25s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .button:hover {
            background: #818cf8;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
        }

        .url {
            margin-top: 22px;
            margin-bottom: 0;
            font-size: 13px;
            color: #94a3b8;
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 12px;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes float {
            0%, 100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -18px;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.55;
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* MOBILE */

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0s !important;
            }
        }

    </style>
</head>

<body>

    <!-- ENVELOPE INTRO -->

    <div class="envelope-screen" id="envelopeScreen">

        <div
            class="envelope"
            id="envelope"
            onclick="openEnvelope()"
            role="button"
            tabindex="0"
            aria-label="Open your message"
            onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openEnvelope(); }"
        >

            <div class="envelope-back"></div>
            <div class="letter"></div>
            <div class="envelope-front"></div>
            <div class="envelope-flap"></div>
            <div class="seal">✉</div>

        </div>

        <div class="envelope-text">
            You've got a message!
        </div>

        <div class="envelope-subtext">
            Click the envelope to open it
        </div>

    </div>


    <!-- MESSAGE CARD -->

    <main class="card" id="messageCard">

        <div class="icon">✉️</div>

        <div class="label">An Important Update</div>

        <h1>Message from Sivasarana</h1>

        <p>
            We've moved! Our website has a new home.
            Please visit our new website using the link below.
        </p>

        <a
            class="button"
            href="https://calculatedbreak.github.io"
        >
            Visit Our New Website →
        </a>

        <p class="url">
            calculatedbreak.github.io
        </p>

        <footer>
            Thank you for visiting!
        </footer>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        let opened = false;

        function openEnvelope() {

            if (opened) return;

            opened = true;

            const envelope = document.getElementById("envelope");
            const screen = document.getElementById("envelopeScreen");
            const card = document.getElementById("messageCard");

            // Open envelope flap, then letter slides out
            envelope.classList.add("open");

            // Fade out envelope screen
            setTimeout(() => {
                screen.classList.add("hide");
            }, 1400);

            // Reveal message card
            setTimeout(() => {
                screen.style.display = "none";
                card.classList.add("show");
            }, 2000);

        }

    </script>

</body>
</html>
